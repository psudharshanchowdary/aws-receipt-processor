version: '3.8'

services:
  receipt-localstack:
    container_name: receipt-localstack
    image: localstack/localstack:3.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,ses
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - "./docker/init.sh:/etc/localstack/init/ready.d/init.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  receipt-api:
    container_name: receipt-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - LOCALSTACK_ENDPOINT=http://receipt-localstack:4566
      - S3_BUCKET=receipts-bucket
      - DYNAMODB_TABLE=Receipts
      - SES_SENDER_EMAIL=noreply@receiptai.local
      - SES_RECIPIENT_EMAIL=test@example.com
      - AWS_DEFAULT_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
    depends_on:
      receipt-localstack:
        condition: service_healthy

  receipt-frontend:
    container_name: receipt-frontend
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - "./frontend:/usr/share/nginx/html"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - receipt-api

  receipt-dynamo-admin:
    container_name: receipt-dynamo-admin
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://receipt-localstack:4566
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
    depends_on:
      receipt-localstack:
        condition: service_healthy
